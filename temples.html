<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple Album">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 800px)">
    <script src="scripts/temples.js" defer></script>
    <title>Temple Album</title>
</head>

<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menuButton" aria-label="Menu Button">☰</button>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Home</h2>
        <div class="gallery">
            <figure>
                <img src="images/san-diego-temple.jpg" alt="Temple of San Diego">
                <figcaption>San Diego - California Temple</figcaption>
            </figure>
            <figure>
                <img src="images/salt-lake-temple.jpg" alt="Temple of Salt Lake City">
                <figcaption>Salt Lake City - Utah Temple</figcaption>
            </figure>
            <figure>
                <img src="images/buenos-aires-temple.jpg" alt="Temple of Buenos Aires">
                <figcaption>Buenos Aires - Argentina Temple</figcaption>

            <figure>
                <img src="images/cordoba-temple.jpeg" alt="Temple of Cordoba">
                <figcaption>Cordoba - Argentina Temple</figcaption>
            </figure>
            <figure>
                <img src="images/lima-peru-temple.jpeg" alt="Temple of Lima">
                <figcaption>Lima - Peru Temple</figcaption>
            </figure>
            <figure>
                <img src="images/barranquilla-temple.jpeg" alt="Temple of Barranquilla">
                <figcaption>Barranquilla - Colombia Temple</figcaption>
            </figure>
            <figure>
                <img src="images/caracas-venezuela-temple.jpeg" alt="Temple of Caracas">
                <figcaption>Caracas - Venezuela Temple</figcaption>
            </figure>
            <figure>
                <img src="images/rexburg-idaho-temple.jpeg" alt="Temple of Rexburg">
                <figcaption>Rexburg - Idaho Temple</figcaption>
            </figure>
            <figure>
                <img src="images/montreal-quebec-temple.jpeg" alt="Temple of Montreal">
                <figcaption>Montreal - Quebec Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
